name: deploy-smoke
# Builds the container images and runs the production compose stack end to
# end: TLS edge (Caddy internal CA), TLS-only Postgres with verify-full
# clients, signed ingest, tree head, export and offline verification.
on:
  push:
    paths: ["deploy/**", "packages/ingestion-go/**", "apps/dashboard/**", "packages/core/**", ".github/workflows/deploy-smoke.yml"]
  pull_request:
    paths: ["deploy/**", "packages/ingestion-go/**", "apps/dashboard/**", "packages/core/**", ".github/workflows/deploy-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: deploy/docker/go.Dockerfile }
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: deploy/docker/dashboard.Dockerfile }

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: deploy/compose }
    env:
      API_DOMAIN: api.localhost
      DASHBOARD_DOMAIN: app.localhost
      CADDY_GLOBAL_OPTIONS: local_certs
      TSA_URL: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: host tools for the smoke test (SDK + verifier)
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @audittrail/core --filter @audittrail/sdk build
          (cd packages/ingestion-go && go build -o bin/ ./cmd/verify)
      - run: ./init-secrets.sh
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300
      - name: containers run as non-root with a read-only root filesystem
        run: |
          for s in api worker purge dashboard; do
            id=$(docker compose ps -q $s)
            user=$(docker inspect -f '{{.Config.User}}' "$id"); ro=$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")
            echo "$s user=$user read_only=$ro"
            [ -n "$user" ] && [ "$user" != "root" ] && [ "$user" != "0" ] && [ "$ro" = "true" ]
          done
      - name: Postgres refuses plaintext and unverified connections
        run: |
          pw=$(cat secrets/postgres_password)
          ! docker compose exec -T -e PGPASSWORD="$pw" postgres psql "host=postgres user=postgres dbname=audittrail sslmode=disable" -c 'select 1'
          docker compose exec -T -e PGPASSWORD="$pw" postgres sh -c 'cat > /tmp/ca.crt' < secrets/ca.crt
          docker compose exec -T -e PGPASSWORD="$pw" postgres psql "host=postgres user=postgres dbname=audittrail sslmode=verify-full sslrootcert=/tmp/ca.crt" -Atc \
            "select 'tls ' || version from pg_stat_ssl where pid = pg_backend_pid()" | grep -q 'tls TLSv1.3'
      - name: API is not reachable except through the edge
        run: |
          ! curl -s --max-time 3 http://127.0.0.1:8080/healthz
          ! curl -s --max-time 3 http://127.0.0.1:5432
      - name: smoke through the TLS edge
        run: |
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt ./edge-root.crt
          curl -s -o /dev/null -w '%{http_code}\n' http://api.localhost/healthz | grep -q 308
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert edge-root.crt https://app.localhost/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert edge-root.crt -u "ci:$(cat secrets/dashboard_password)" https://app.localhost/)" = 200
          API=https://api.localhost CA=$PWD/edge-root.crt ADMIN_TOKEN_FILE=secrets/admin_token \
            WORKER="docker compose run --rm -T worker -once" ./smoke.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v
