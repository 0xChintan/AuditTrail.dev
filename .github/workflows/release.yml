name: release
# v2 task 7.3 (threat T13). Triggered by pushing a tag like v0.2.0.
#  - npm packages published with provenance (OIDC; the npm account uses 2FA)
#  - Go binaries + WASM verifier: built reproducibly (-trimpath), SHA-256
#    sums, CycloneDX SBOMs, GitHub build-provenance attestations and
#    Sigstore keyless signatures
#  - container images (server, dashboard) on GHCR for linux/amd64+arm64,
#    with SBOM + provenance attestations and cosign keyless signatures
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload release assets
      id-token: write      # Sigstore keyless signing + attestations
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: build
        run: |
          set -e
          mkdir -p dist
          for os in linux darwin; do for arch in amd64 arm64; do
            for cmd in api worker witness verify migrate admin purge healthcheck; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o dist/audittrail-$cmd-$os-$arch ./packages/ingestion-go/cmd/$cmd
            done
          done; done
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o dist/audittrail-verify.wasm ./packages/ingestion-go/cmd/verify-wasm
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod mod -json -licenses -output dist/sbom-go.cdx.json .
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*" }
      - uses: sigstore/cosign-installer@v3
      - name: sign (Sigstore keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  npm:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 24, registry-url: "https://registry.npmjs.org", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build && pnpm -r --filter "./packages/*" test
      - run: pnpm -r --filter "./packages/*" publish --access public --provenance --no-git-checks
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}", NPM_CONFIG_PROVENANCE: "true" }

  images:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # cosign keyless + attestations
      attestations: write
    strategy:
      matrix:
        include:
          - { name: server, dockerfile: deploy/docker/go.Dockerfile }
          - { name: dashboard, dockerfile: deploy/docker/dashboard.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/audittrail-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
