# AuditTrail Postgres client authentication.
# TYPE    DATABASE  USER      ADDRESS  METHOD
# Unix socket inside the container only (image init scripts, pg_isready).
local     all       postgres           peer
# TCP: TLS only, SCRAM passwords. There are deliberately no "host" or
# "hostnossl" lines, so plaintext TCP connections are rejected.
hostssl   all       all       all      scram-sha-256
